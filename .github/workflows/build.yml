          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity(), CameraEngine.Listener {

              companion object {
                  private const val REQ_CAMERA = 100
              }

              private lateinit var engine: CameraEngine
              private lateinit var surfaceView: SurfaceView
              private lateinit var flashOverlay: View
              private lateinit var flashTv: TextView
              private lateinit var zoomTv: TextView
              private lateinit var switchTv: TextView
              private lateinit var thumbIv: ImageView

              private var orient: OrientationEventListener? = null
              private var activeGen = 0
              private var cameraStarted = false
              private var scaled = false
              private var lastSavedUri: Uri? = null
              private var lastThumb: Bitmap? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Log2.i("Activity.onCreate +${Log2.sinceStart()}ms")

                  engine = CameraEngine(this, this)

                  // Start opening the camera immediately in parallel with UI construction
                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      val dm = resources.displayMetrics
                      activeGen = engine.start(CameraCharacteristics.LENS_FACING_BACK, dm.widthPixels, dm.heightPixels)
                      cameraStarted = true
                  }

                  buildUi()

                  if (!cameraStarted) {
                      requestPermissions(arrayOf(Manifest.permission.CAMERA), REQ_CAMERA)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (!cameraStarted && checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      val dm = resources.displayMetrics
                      activeGen = engine.start(engine.currentFacing, dm.widthPixels, dm.heightPixels)
                      cameraStarted = true
                      val holder = surfaceView.holder
                      if (holder.surface != null && holder.surface.isValid) {
                          engine.onSurfaceReady(activeGen, holder.surface)
                      }
                  }
                  orient?.let { if (it.canDetectOrientation()) it.enable() }
              }

              override fun onPause() {
                  orient?.disable()
                  if (cameraStarted) {
                      engine.stop()
                      cameraStarted = false
                  }
                  Log2.enableDisk(this)
                  super.onPause()
              }

              override fun onDestroy() {
                  Log2.i("Activity.onDestroy")
                  engine.destroy()
                  lastThumb?.recycle()
                  lastThumb = null
                  super.onDestroy()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  if (requestCode == REQ_CAMERA) {
                      val ok = grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED
                      Log2.i("camera permission granted=$ok")
                      if (ok) {
                          val dm = resources.displayMetrics
                          activeGen = engine.start(engine.currentFacing, dm.widthPixels, dm.heightPixels)
                          cameraStarted = true
                          val holder = surfaceView.holder
                          if (holder.surface != null && holder.surface.isValid) {
                              engine.onSurfaceReady(activeGen, holder.surface)
                          }
                      } else {
                          Toast.makeText(this, "Camera permission required", Toast.LENGTH_LONG).show()
                      }
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density + 0.5f).toInt()

              private fun label(t: String) = TextView(this).apply {
                  text = t
                  setTextColor(Color.WHITE)
                  textSize = 18f
                  setPadding(dp(16), dp(12), dp(16), dp(12))
              }

              private fun buildUi() {
                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)

                  surfaceView = SurfaceView(this)
                  surfaceView.holder.addCallback(object : SurfaceHolder.Callback {
                      override fun surfaceCreated(holder: SurfaceHolder) {
                          if (cameraStarted) engine.onSurfaceReady(activeGen, holder.surface)
                      }

                      override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                          if (cameraStarted) engine.onSurfaceReady(activeGen, holder.surface)
                      }

                      override fun surfaceDestroyed(holder: SurfaceHolder) {
                          engine.onSurfaceDestroyed()
                      }
                  })
                  root.addView(surfaceView, FrameLayout.LayoutParams(-1, -1, Gravity.CENTER))

                  // Separate overlay for shutter confirmation flash (never mutates SurfaceView alpha)
                  flashOverlay = View(this).apply {
                      setBackgroundColor(Color.WHITE)
                      alpha = 0f
                      visibility = View.GONE
                  }
                  root.addView(flashOverlay, FrameLayout.LayoutParams(-1, -1))

                  // Pinch = zoom, tap = focus
                  val sgd = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(d: ScaleGestureDetector): Boolean {
                          scaled = true
                          engine.scaleZoom(d.scaleFactor)
                          return true
                      }
                  })
                  surfaceView.setOnTouchListener { v, e ->
                      if (e.actionMasked == MotionEvent.ACTION_DOWN) scaled = false
                      sgd.onTouchEvent(e)
                      if (e.actionMasked == MotionEvent.ACTION_UP && !scaled) {
                          engine.focusAt(e.x, e.y, v.width, v.height)
                          v.performClick()
                      }
                      true
                  }

                  // Top-left: Flash
                  flashTv = label(flashLabel(engine.flashMode)).apply {
                      setOnClickListener {
                          val next = engine.cycleFlash()
                          text = flashLabel(next)
                          Log2.i("flash -> ${flashLabel(next)}")
                      }
                  }
                  root.addView(
                      flashTv,
                      FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START).apply {
                          leftMargin = dp(12)
                          topMargin = dp(16)
                      }
                  )

                  // Top-right: Zoom
                  zoomTv = label("1.0x").apply {
                      setOnClickListener { engine.resetZoom() }
                  }
                  root.addView(
                      zoomTv,
                      FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).apply {
                          rightMargin = dp(12)
                          topMargin = dp(16)
                      }
                  )

                  // Bottom-left: Last captured frame thumbnail
                  thumbIv = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      visibility = View.INVISIBLE
                      background = GradientDrawable().apply {
                          setColor(0xFF1A1A1A.toInt())
                          setStroke(dp(2), Color.WHITE)
                          cornerRadius = dp(6).toFloat()
                      }
                      clipToOutline = true
                      setPadding(dp(2), dp(2), dp(2), dp(2))
                      setOnClickListener {
                          val u = lastSavedUri ?: return@setOnClickListener
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW).setDataAndType(u, "image/jpeg").addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION))
                          } catch (_: Throwable) {}
                      }
                  }
                  root.addView(
                      thumbIv,
                      FrameLayout.LayoutParams(dp(56), dp(56), Gravity.BOTTOM or Gravity.START).apply {
                          leftMargin = dp(24)
                          bottomMargin = dp(46)
                      }
                  )

                  // Bottom-center: Shutter
                  val shutter = View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.WHITE)
                          setStroke(dp(5), 0xFF666666.toInt())
                      }
                      setOnClickListener { engine.takePhoto() }
                  }
                  root.addView(
                      shutter,
                      FrameLayout.LayoutParams(dp(76), dp(76), Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply {
                          bottomMargin = dp(36)
                      }
                  )

                  // Bottom-right: Switch front/back camera (shown after first frame if device has both)
                  switchTv = label("↻").apply {
                      textSize = 26f
                      visibility = View.GONE
                      setOnClickListener {
                          activeGen = engine.switchCamera()
                          val holder = surfaceView.holder
                          if (holder.surface != null && holder.surface.isValid) {
                              engine.onSurfaceReady(activeGen, holder.surface)
                          }
                      }
                  }
                  root.addView(
                      switchTv,
                      FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.END).apply {
                          rightMargin = dp(24)
                          bottomMargin = dp(46)
                      }
                  )

                  setContentView(root)
              }

              private fun flashLabel(mode: Int) = when (mode) {
                  CameraEngine.FLASH_ON -> "⚡ ON"
                  CameraEngine.FLASH_AUTO -> "⚡ AUTO"
                  else -> "⚡ OFF"
              }

              // ---- CameraEngine.Listener ----

              override fun onPreviewSizeReady(gen: Int, width: Int, height: Int, sensorOrientation: Int) {
                  if (gen != activeGen) return
                  surfaceView.holder.setFixedSize(width, height)

                  val dm = resources.displayMetrics
                  val screenW = dm.widthPixels
                  val screenH = dm.heightPixels
                  val rotated = sensorOrientation == 90 || sensorOrientation == 270
                  val bufW = if (rotated) height else width
                  val bufH = if (rotated) width else height

                  val scale = minOf(screenW.toFloat() / bufW, screenH.toFloat() / bufH)
                  val targetW = (bufW * scale + 0.5f).toInt()
                  val targetH = (bufH * scale + 0.5f).toInt()

                  val lp = surfaceView.layoutParams as FrameLayout.LayoutParams
                  if (lp.width != targetW || lp.height != targetH) {
                      lp.width = targetW
                      lp.height = targetH
                      surfaceView.layoutParams = lp
                  }
              }

              override fun onCameraReady(facing: Int, hasFlash: Boolean, minZoom: Float, maxZoom: Float) {
                  flashTv.isEnabled = hasFlash
                  flashTv.alpha = if (hasFlash) 1f else 0.3f
                  zoomTv.text = "1.0x"
              }

              override fun onSwitchAvailability(canSwitch: Boolean) {
                  switchTv.visibility = if (canSwitch) View.VISIBLE else View.GONE
              }

              override fun onFirstFrame() {
                  // Deferred strictly until after the first preview frame is on screen
                  Log2.enableDisk(this)
                  if (orient == null) {
                      orient = object : OrientationEventListener(this) {
                          override fun onOrientationChanged(o: Int) {
                              if (o != ORIENTATION_UNKNOWN) engine.setDeviceOrientation(o)
                          }
                      }.apply {
                          if (canDetectOrientation()) enable()
                      }
                  }
              }

              override fun onShutterTriggered() {
                  flashOverlay.animate().cancel()
                  flashOverlay.visibility = View.VISIBLE
                  flashOverlay.alpha = 0.7f
                  flashOverlay.animate()
                      .alpha(0f)
                      .setDuration(75L)
                      .withEndAction { flashOverlay.visibility = View.GONE }
                      .start()
              }

              override fun onZoomChanged(zoom: Float) {
                  val z10 = (zoom * 10f + 0.5f).toInt()
                  zoomTv.text = "${z10 / 10}.${z10 % 10}x"
              }

              override fun onThumbReady(bitmap: Bitmap) {
                  val prev = lastThumb
                  lastThumb = bitmap
                  thumbIv.setImageBitmap(bitmap)
                  thumbIv.visibility = View.VISIBLE
                  if (prev != null && prev !== bitmap) prev.recycle()
              }

              override fun onPhotoSaved(uri: Uri) {
                  lastSavedUri = uri
              }

              override fun onError(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }
          }
          EOF

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FastCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FastCam
          path: FastCam.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" FastCam.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "FastCam build ${{ github.run_number }}" \
            --notes "Direct APK download"
