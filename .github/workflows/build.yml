name: Build FastCam APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Generate Gradle files
        run: |
          mkdir -p app/src/main/java/com/fastcam app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FastCam"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fastcam"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fastcam"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              signingConfigs {
                  create("rel") {
                      storeFile = file("../fastcam.jks")
                      storePassword = "fastcam123"
                      keyAlias = "fastcam"
                      keyPassword = "fastcam123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("rel")
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          EOF

          echo "# FastCam" > app/proguard-rules.pro

          keytool -genkeypair -keystore fastcam.jks -alias fastcam -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass fastcam123 -keypass fastcam123 -dname "CN=FastCam"

      - name: Generate resources
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.front" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

              <application
                  android:name=".App"
                  android:label="FastCam"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_bg">#202020</color>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M30,42h12l4,-6h16l4,6h12v30H30z" />
              <path android:fillColor="#202020" android:pathData="M44,57a10,10 0 1,0 20,0a10,10 0 1,0 -20,0z" />
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

      - name: Generate Kotlin sources
        run: |
          cat > app/src/main/java/com/fastcam/Log2.kt <<'EOF'
          package com.fastcam

          import android.content.Context
          import android.os.Process
          import android.os.SystemClock
          import android.util.Log
          import java.io.File
          import java.io.FileOutputStream
          import java.time.Instant
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import java.util.ArrayDeque
          import java.util.Locale
          import java.util.concurrent.Executors

          // Timing/diagnostic log only: Android/data/com.fastcam/files/fastcam.log
          object Log2 {
              private const val TAG = "FastCam"
              private val io = Executors.newSingleThreadExecutor()
              private val fmt = DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss.SSS", Locale.US)
              private val lock = Any()
              private val buffer = ArrayDeque<Pair<Long, String>>(64)
              @Volatile private var diskEnabled = false
              private var logFile: File? = null

              fun sinceStart(): Long = SystemClock.elapsedRealtime() - Process.getStartElapsedRealtime()

              fun enableDisk(context: Context) {
                  val appCtx = context.applicationContext
                  synchronized(lock) {
                      if (diskEnabled) return
                      diskEnabled = true
                  }
                  io.execute {
                      try {
                          val f = File(appCtx.getExternalFilesDir(null) ?: appCtx.filesDir, "fastcam.log")
                          if (f.exists() && f.length() > 512_000) f.delete()
                          logFile = f
                          flushBuffered(f)
                      } catch (_: Throwable) {}
                  }
              }

              fun i(m: String) = record(Log.INFO, m)

              fun e(m: String, t: Throwable? = null) =
                  record(Log.ERROR, m + if (t != null) " :: ${t.javaClass.simpleName}: ${t.message}" else "")

              private fun record(priority: Int, m: String) {
                  Log.println(priority, TAG, m)
                  val now = System.currentTimeMillis()
                  val ready: Boolean
                  synchronized(lock) {
                      if (buffer.size >= 200) buffer.pollFirst()
                      buffer.addLast(now to m)
                      ready = diskEnabled
                  }
                  if (ready) {
                      io.execute {
                          val f = logFile ?: return@execute
                          flushBuffered(f)
                      }
                  }
              }

              private fun flushBuffered(f: File) {
                  val batch = ArrayList<Pair<Long, String>>()
                  synchronized(lock) {
                      while (buffer.isNotEmpty()) batch.add(buffer.removeFirst())
                  }
                  if (batch.isEmpty()) return
                  try {
                      val sb = StringBuilder(batch.size * 64)
                      val zone = ZoneId.systemDefault()
                      for ((ts, msg) in batch) {
                          sb.append(fmt.format(Instant.ofEpochMilli(ts).atZone(zone)))
                              .append(' ')
                              .append(msg)
                              .append('\n')
                      }
                      FileOutputStream(f, true).use { it.write(sb.toString().toByteArray(Charsets.UTF_8)) }
                  } catch (_: Throwable) {}
              }
          }
          EOF

          cat > app/src/main/java/com/fastcam/App.kt <<'EOF'
          package com.fastcam

          import android.app.Application

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  // Keep Application.onCreate completely free of camera/disk I/O
                  Log2.i("App.onCreate +${Log2.sinceStart()}ms")
              }
          }
          EOF

          cat > app/src/main/java/com/fastcam/CameraEngine.kt <<'EOF'
          package com.fastcam

          import android.Manifest
          import android.content.ContentValues
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.ImageFormat
          import android.graphics.Matrix
          import android.graphics.Rect
          import android.hardware.camera2.CameraCaptureSession
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraDevice
          import android.hardware.camera2.CameraManager
          import android.hardware.camera2.CameraMetadata
          import android.hardware.camera2.CaptureFailure
          import android.hardware.camera2.CaptureRequest
          import android.hardware.camera2.CaptureResult
          import android.hardware.camera2.TotalCaptureResult
          import android.hardware.camera2.params.MeteringRectangle
          import android.hardware.camera2.params.OutputConfiguration
          import android.hardware.camera2.params.SessionConfiguration
          import android.media.ExifInterface
          import android.media.Image
          import android.media.ImageReader
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.Looper
          import android.os.Process
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.util.Size
          import android.view.Surface
          import android.view.SurfaceHolder
          import java.io.ByteArrayInputStream
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter
          import java.util.ArrayDeque
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.Executor
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class CameraEngine(
              context: Context,
              private val listener: Listener
          ) {
              interface Listener {
                  fun onPreviewSizeReady(gen: Int, width: Int, height: Int, sensorOrientation: Int)
                  fun onCameraReady(facing: Int, hasFlash: Boolean, minZoom: Float, maxZoom: Float)
                  fun onSwitchAvailability(canSwitch: Boolean)
                  fun onFirstFrame()
                  fun onShutterTriggered()
                  fun onZoomChanged(zoom: Float)
                  fun onThumbReady(bitmap: Bitmap)
                  fun onPhotoSaved(uri: Uri)
                  fun onError(msg: String)
              }

              companion object {
                  const val FLASH_OFF = 0
                  const val FLASH_ON = 1
                  const val FLASH_AUTO = 2

                  private const val STATE_PREVIEW = 0
                  private const val STATE_WAITING_LOCK = 1
                  private const val STATE_WAITING_PRECAPTURE = 2
                  private const val STATE_WAITING_NON_PRECAPTURE = 3

                  private const val MAX_IMAGES = 4
                  private const val MAX_IN_FLIGHT = 3
                  private const val MAX_JPEG_PIXELS = 16_500_000L
                  private const val PREFS_NAME = "fc_cam_cache"
                  private val NAME_FMT = DateTimeFormatter.ofPattern("yyyyMMdd_HHmmss_SSS", Locale.US)
              }

              private data class CamMeta(
                  val id: String,
                  val facing: Int,
                  val fromCache: Boolean,
                  val sensorOrientation: Int,
                  val hasFlash: Boolean,
                  val activeArray: Rect,
                  val minZoom: Float,
                  val maxZoom: Float,
                  val useZoomRatioApi: Boolean,
                  val hasAutoFocus: Boolean,
                  val hasContinuousAf: Boolean,
                  val hasAutoAf: Boolean,
                  val supportsAeAlwaysFlash: Boolean,
                  val supportsAeAutoFlash: Boolean,
                  val supportsFastEdge: Boolean,
                  val supportsFastNr: Boolean,
                  val maxRegionsAf: Int,
                  val maxRegionsAe: Int,
                  val isLegacy: Boolean,
                  val previewSize: Size,
                  val jpegSize: Size
              )

              private data class ShotMeta(val t0: Long)

              private val appCtx = context.applicationContext
              private val manager = appCtx.getSystemService(CameraManager::class.java)
              private val camThread = HandlerThread("FastCam-Cam", Process.THREAD_PRIORITY_URGENT_DISPLAY).apply { start() }
              private val camHandler = Handler(camThread.looper)
              private val camExecutor = Executor { camHandler.post(it) }
              private val ioExecutor = Executors.newSingleThreadExecutor()
              private val mainHandler = Handler(Looper.getMainLooper())

              private val openGen = AtomicInteger(0)
              private val inFlightCaptures = AtomicInteger(0)
              @Volatile private var active = false
              @Volatile private var deviceOrientationDeg = 0
              @Volatile var currentFacing = CameraCharacteristics.LENS_FACING_BACK
                  private set
              @Volatile var flashMode = FLASH_OFF
                  private set
              @Volatile var currentZoom = 1f
                  private set

              // Confined strictly to camHandler
              private val metaCache = HashMap<Int, CamMeta>(2)
              private val pendingShots = ArrayDeque<ShotMeta>(MAX_IMAGES)
              private var activeMeta: CamMeta? = null
              private var cameraDevice: CameraDevice? = null
              private var captureSession: CameraCaptureSession? = null
              private var imageReader: ImageReader? = null
              private var previewSurface: Surface? = null
              private var surfaceGen = -1
              private var previewBuilder: CaptureRequest.Builder? = null
              private var displayW = 1080
              private var displayH = 1920
              private var firstFrameSeen = false
              private var switchChecked = false
              private var capState = STATE_PREVIEW
              private var lastAfState: Int? = null
              private var lastAeState: Int? = null
              private var pendingShotTime = 0L
              private var pendingJpegOrient = 90
              private var pendingNeedsFlash = false
              private var customAfRegions: Array<MeteringRectangle>? = null
              private var customAeRegions: Array<MeteringRectangle>? = null

              private val precaptureTimeout = Runnable {
                  if (capState != STATE_PREVIEW) {
                      Log2.i("precapture timeout -> capture")
                      capState = STATE_PREVIEW
                      captureStillPicture(pendingShotTime, pendingJpegOrient, unlockAfter = true)
                  }
              }

              private val resetFocusRunnable = Runnable {
                  if (capState != STATE_PREVIEW) return@Runnable
                  customAfRegions = null
                  customAeRegions = null
                  updatePreviewRepeating()
              }

              fun start(facing: Int, dispW: Int, dispH: Int): Int {
                  currentFacing = facing
                  active = true
                  val gen = openGen.incrementAndGet()
                  camHandler.post {
                      displayW = max(1, dispW)
                      displayH = max(1, dispH)
                      openForFacing(gen, facing, allowFallback = true)
                  }
                  return gen
              }

              fun switchCamera(): Int {
                  val nextFacing = if (currentFacing == CameraCharacteristics.LENS_FACING_BACK) {
                      CameraCharacteristics.LENS_FACING_FRONT
                  } else {
                      CameraCharacteristics.LENS_FACING_BACK
                  }
                  Log2.i("switch camera -> facing=$nextFacing")
                  currentFacing = nextFacing
                  currentZoom = 1f
                  active = true
                  val gen = openGen.incrementAndGet()
                  camHandler.post {
                      closeCameraInternal()
                      openForFacing(gen, nextFacing, allowFallback = true)
                  }
                  return gen
              }

              fun onSurfaceReady(gen: Int, surface: Surface) {
                  camHandler.post {
                      if (!active || gen != openGen.get()) return@post
                      previewSurface = surface
                      surfaceGen = gen
                      tryCreateSession(gen)
                  }
              }

              fun onSurfaceDestroyed() {
                  camHandler.post {
                      previewSurface = null
                      surfaceGen = -1
                      closeSessionInternal()
                  }
              }

              fun stop() {
                  active = false
                  openGen.incrementAndGet()
                  val latch = CountDownLatch(1)
                  camHandler.post {
                      closeCameraInternal()
                      latch.countDown()
                  }
                  try {
                      latch.await(400, TimeUnit.MILLISECONDS)
                  } catch (_: InterruptedException) {}
              }

              fun destroy() {
                  stop()
                  camThread.quitSafely()
                  ioExecutor.shutdown()
              }

              fun setDeviceOrientation(deg: Int) {
                  deviceOrientationDeg = deg
              }

              fun cycleFlash(): Int {
                  val next = when (flashMode) {
                      FLASH_OFF -> FLASH_ON
                      FLASH_ON -> FLASH_AUTO
                      else -> FLASH_OFF
                  }
                  flashMode = next
                  camHandler.post { updatePreviewRepeating() }
                  return next
              }

              fun scaleZoom(scaleFactor: Float) {
                  camHandler.post {
                      val meta = activeMeta ?: return@post
                      val nz = (currentZoom * scaleFactor).coerceIn(meta.minZoom, meta.maxZoom)
                      if (abs(nz - currentZoom) < 0.01f) return@post
                      currentZoom = nz
                      updatePreviewRepeating()
                      mainHandler.post { listener.onZoomChanged(nz) }
                  }
              }

              fun resetZoom() {
                  camHandler.post {
                      val meta = activeMeta ?: return@post
                      val target = 1f.coerceIn(meta.minZoom, meta.maxZoom)
                      currentZoom = target
                      updatePreviewRepeating()
                      mainHandler.post { listener.onZoomChanged(target) }
                  }
              }

              fun focusAt(x: Float, y: Float, viewW: Int, viewH: Int) {
                  if (viewW <= 0 || viewH <= 0) return
                  camHandler.post {
                      val cam = cameraDevice ?: return@post
                      val session = captureSession ?: return@post
                      val meta = activeMeta ?: return@post
                      if (capState != STATE_PREVIEW) return@post
                      if (!meta.hasAutoFocus && meta.maxRegionsAe <= 0) return@post

                      val nx = (x / viewW.toFloat()).coerceIn(0f, 1f)
                      val ny = (y / viewH.toFloat()).coerceIn(0f, 1f)
                      val isFront = meta.facing == CameraCharacteristics.LENS_FACING_FRONT

                      val sx: Float
                      val sy: Float
                      when (meta.sensorOrientation) {
                          90 -> {
                              sx = ny
                              sy = if (isFront) nx else 1f - nx
                          }
                          270 -> {
                              sx = 1f - ny
                              sy = if (isFront) 1f - nx else nx
                          }
                          180 -> {
                              sx = if (isFront) nx else 1f - nx
                              sy = 1f - ny
                          }
                          else -> {
                              sx = if (isFront) 1f - nx else nx
                              sy = ny
                          }
                      }

                      val visible = currentVisibleCropRect(meta)
                      val cx = (visible.left + sx * visible.width()).toInt()
                      val cy = (visible.top + sy * visible.height()).toInt()
                      val halfW = max(1, (visible.width() * 0.08f).toInt())
                      val halfH = max(1, (visible.height() * 0.08f).toInt())
                      val rect = Rect(
                          (cx - halfW).coerceIn(meta.activeArray.left, meta.activeArray.right - 1),
                          (cy - halfH).coerceIn(meta.activeArray.top, meta.activeArray.bottom - 1),
                          (cx + halfW).coerceIn(meta.activeArray.left + 1, meta.activeArray.right),
                          (cy + halfH).coerceIn(meta.activeArray.top + 1, meta.activeArray.bottom)
                      )
                      if (rect.width() <= 0 || rect.height() <= 0) return@post

                      val mr = arrayOf(MeteringRectangle(rect, 800))
                      customAfRegions = if (meta.maxRegionsAf > 0) mr else null
                      customAeRegions = if (meta.maxRegionsAe > 0) mr else null

                      try {
                          val pb = previewBuilder ?: return@post
                          applyPreviewParams(pb, meta)
                          if (meta.hasAutoAf) pb.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_AUTO)
                          pb.set(CaptureRequest.CONTROL_AF_TRIGGER, CameraMetadata.CONTROL_AF_TRIGGER_IDLE)
                          session.setRepeatingRequest(pb.build(), previewCallback, camHandler)

                          if (meta.hasAutoFocus) {
                              val trig = cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                              previewSurface?.let { trig.addTarget(it) }
                              applyPreviewParams(trig, meta)
                              if (meta.hasAutoAf) trig.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_AUTO)
                              trig.set(CaptureRequest.CONTROL_AF_TRIGGER, CameraMetadata.CONTROL_AF_TRIGGER_START)
                              session.capture(trig.build(), previewCallback, camHandler)
                          }
                          camHandler.removeCallbacks(resetFocusRunnable)
                          camHandler.postDelayed(resetFocusRunnable, 3000L)
                      } catch (e: Throwable) {
                          Log2.e("focusAt failed", e)
                      }
                  }
              }

              fun takePhoto() {
                  val t0 = SystemClock.elapsedRealtime()
                  camHandler.post {
                      val meta = activeMeta ?: return@post
                      if (cameraDevice == null || captureSession == null || imageReader == null) return@post
                      if (capState != STATE_PREVIEW) return@post
                      if (inFlightCaptures.get() >= MAX_IN_FLIGHT) {
                          Log2.i("capture dropped: queue full")
                          return@post
                      }

                      val jpegOrient = computeJpegOrientation(meta, deviceOrientationDeg)
                      val needsFlash = meta.hasFlash && (
                          flashMode == FLASH_ON ||
                              (flashMode == FLASH_AUTO && lastAeState == CaptureResult.CONTROL_AE_STATE_FLASH_REQUIRED)
                          )

                      val afReady = !meta.hasAutoFocus ||
                          lastAfState == CaptureResult.CONTROL_AF_STATE_FOCUSED_LOCKED ||
                          lastAfState == CaptureResult.CONTROL_AF_STATE_PASSIVE_FOCUSED
                      val aeReady = !needsFlash && (
                          lastAeState == null ||
                              lastAeState == CaptureResult.CONTROL_AE_STATE_CONVERGED ||
                              lastAeState == CaptureResult.CONTROL_AE_STATE_LOCKED
                          )

                      Log2.i("capture requested facing=${meta.facing} flash=$flashMode zoom=$currentZoom af=$lastAfState ae=$lastAeState fast=${afReady && aeReady}")

                      if (afReady && aeReady) {
                          captureStillPicture(t0, jpegOrient, unlockAfter = false)
                      } else {
                          pendingShotTime = t0
                          pendingJpegOrient = jpegOrient
                          pendingNeedsFlash = needsFlash
                          startPrecapture(meta, afReady, needsFlash)
                      }
                  }
              }

              // ---- Camera open & caching (strictly on camHandler) ----

              private fun openForFacing(gen: Int, facing: Int, allowFallback: Boolean) {
                  if (!active || gen != openGen.get()) return
                  if (appCtx.checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      Log2.i("open skipped: no CAMERA permission")
                      return
                  }

                  val meta = resolveMeta(facing, allowFallback)
                  if (meta == null) {
                      Log2.e("no camera found for facing=$facing")
                      mainHandler.post { listener.onError("No camera available") }
                      return
                  }

                  activeMeta = meta
                  currentFacing = meta.facing
                  currentZoom = 1f.coerceIn(meta.minZoom, meta.maxZoom)
                  customAfRegions = null
                  customAeRegions = null
                  lastAfState = null
                  lastAeState = null
                  capState = STATE_PREVIEW

                  mainHandler.post {
                      listener.onPreviewSizeReady(gen, meta.previewSize.width, meta.previewSize.height, meta.sensorOrientation)
                      listener.onCameraReady(meta.facing, meta.hasFlash, meta.minZoom, meta.maxZoom)
                  }

                  try {
                      imageReader?.close()
                      imageReader = ImageReader.newInstance(
                          meta.jpegSize.width,
                          meta.jpegSize.height,
                          ImageFormat.JPEG,
                          MAX_IMAGES
                      ).apply {
                          setOnImageAvailableListener(::onImageAvailable, camHandler)
                      }
                  } catch (e: Throwable) {
                      Log2.e("ImageReader init failed", e)
                      mainHandler.post { listener.onError("ImageReader failed") }
                      return
                  }

                  try {
                      Log2.i("openCamera id=${meta.id} cached=${meta.fromCache} +${Log2.sinceStart()}ms")
                      manager.openCamera(meta.id, camExecutor, object : CameraDevice.StateCallback() {
                          override fun onOpened(camera: CameraDevice) {
                              if (!active || gen != openGen.get()) {
                                  try { camera.close() } catch (_: Throwable) {}
                                  return
                              }
                              cameraDevice = camera
                              Log2.i("camera opened id=${meta.id} +${Log2.sinceStart()}ms")
                              tryCreateSession(gen)
                          }

                          override fun onDisconnected(camera: CameraDevice) {
                              Log2.i("camera disconnected id=${meta.id}")
                              if (cameraDevice === camera) {
                                  closeCameraInternal()
                              } else {
                                  try { camera.close() } catch (_: Throwable) {}
                              }
                          }

                          override fun onError(camera: CameraDevice, error: Int) {
                              Log2.e("camera error id=${meta.id} code=$error")
                              if (cameraDevice === camera) {
                                  closeCameraInternal()
                              } else {
                                  try { camera.close() } catch (_: Throwable) {}
                              }
                              if (meta.fromCache && allowFallback && active && gen == openGen.get()) {
                                  invalidateCachedId(facing)
                                  openForFacing(gen, facing, allowFallback = false)
                              } else if (active && gen == openGen.get()) {
                                  mainHandler.post { listener.onError("Camera error ($error)") }
                              }
                          }
                      })
                  } catch (e: Throwable) {
                      Log2.e("openCamera threw id=${meta.id}", e)
                      if (meta.fromCache && allowFallback) {
                          invalidateCachedId(facing)
                          openForFacing(gen, facing, allowFallback = false)
                      } else {
                          mainHandler.post { listener.onError("Cannot open camera") }
                      }
                  }
              }

              private fun resolveMeta(facing: Int, allowFallback: Boolean): CamMeta? {
                  metaCache[facing]?.let { return it }

                  val prefs = appCtx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val cachedId = prefs.getString("id_$facing", null)
                  if (cachedId != null) {
                      val loaded = try { loadMeta(cachedId, facing, fromCache = true) } catch (_: Throwable) { null }
                      if (loaded != null) {
                          metaCache[facing] = loaded
                          return loaded
                      }
                      prefs.edit().remove("id_$facing").apply()
                  }

                  val ids = try { manager.cameraIdList } catch (e: Throwable) {
                      Log2.e("cameraIdList failed", e)
                      return null
                  }
                  var matchedId: String? = null
                  for (id in ids) {
                      try {
                          val ch = manager.getCameraCharacteristics(id)
                          if (ch.get(CameraCharacteristics.LENS_FACING) == facing) {
                              matchedId = id
                              break
                          }
                      } catch (_: Throwable) {}
                  }
                  if (matchedId == null && allowFallback) {
                      matchedId = ids.firstOrNull()
                  }
                  val chosenId = matchedId ?: return null
                  val loaded = try { loadMeta(chosenId, null, fromCache = false) } catch (e: Throwable) {
                      Log2.e("loadMeta failed id=$chosenId", e)
                      return null
                  } ?: return null

                  prefs.edit().putString("id_${loaded.facing}", loaded.id).apply()
                  metaCache[loaded.facing] = loaded
                  return loaded
              }

              private fun invalidateCachedId(facing: Int) {
                  metaCache.remove(facing)
                  appCtx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit().remove("id_$facing").apply()
              }

              private fun loadMeta(id: String, expectedFacing: Int?, fromCache: Boolean): CamMeta? {
                  val ch = manager.getCameraCharacteristics(id)
                  val facing = ch.get(CameraCharacteristics.LENS_FACING) ?: return null
                  if (expectedFacing != null && facing != expectedFacing) return null

                  val sensorOrientation = ch.get(CameraCharacteristics.SENSOR_ORIENTATION) ?: 90
                  val hasFlash = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  val activeArray = ch.get(CameraCharacteristics.SENSOR_INFO_ACTIVE_ARRAY_SIZE)
                      ?: Rect(0, 0, 4000, 3000)

                  val minZoom: Float
                  val maxZoom: Float
                  val useZoomRatioApi: Boolean
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      val zr = ch.get(CameraCharacteristics.CONTROL_ZOOM_RATIO_RANGE)
                      if (zr != null) {
                          minZoom = zr.lower
                          maxZoom = zr.upper
                          useZoomRatioApi = true
                      } else {
                          minZoom = 1f
                          maxZoom = max(1f, ch.get(CameraCharacteristics.SCALER_AVAILABLE_MAX_DIGITAL_ZOOM) ?: 1f)
                          useZoomRatioApi = false
                      }
                  } else {
                      minZoom = 1f
                      maxZoom = max(1f, ch.get(CameraCharacteristics.SCALER_AVAILABLE_MAX_DIGITAL_ZOOM) ?: 1f)
                      useZoomRatioApi = false
                  }

                  val afModes = ch.get(CameraCharacteristics.CONTROL_AF_AVAILABLE_MODES) ?: IntArray(0)
                  val hasContinuousAf = afModes.contains(CameraMetadata.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                  val hasAutoAf = afModes.contains(CameraMetadata.CONTROL_AF_MODE_AUTO)
                  val minFocusDist = ch.get(CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE)
                  val hasAutoFocus = (hasContinuousAf || hasAutoAf) && (minFocusDist == null || minFocusDist > 0f)

                  val aeModes = ch.get(CameraCharacteristics.CONTROL_AE_AVAILABLE_MODES) ?: IntArray(0)
                  val supportsAeAlwaysFlash = aeModes.contains(CameraMetadata.CONTROL_AE_MODE_ON_ALWAYS_FLASH)
                  val supportsAeAutoFlash = aeModes.contains(CameraMetadata.CONTROL_AE_MODE_ON_AUTO_FLASH)

                  val edgeModes = ch.get(CameraCharacteristics.EDGE_AVAILABLE_EDGE_MODES) ?: IntArray(0)
                  val supportsFastEdge = edgeModes.contains(CameraMetadata.EDGE_MODE_FAST)

                  val nrModes = ch.get(CameraCharacteristics.NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES) ?: IntArray(0)
                  val supportsFastNr = nrModes.contains(CameraMetadata.NOISE_REDUCTION_MODE_FAST)

                  val maxRegionsAf = ch.get(CameraCharacteristics.CONTROL_MAX_REGIONS_AF) ?: 0
                  val maxRegionsAe = ch.get(CameraCharacteristics.CONTROL_MAX_REGIONS_AE) ?: 0
                  val hwLevel = ch.get(CameraCharacteristics.INFO_SUPPORTED_HARDWARE_LEVEL)
                      ?: CameraCharacteristics.INFO_SUPPORTED_HARDWARE_LEVEL_LEGACY
                  val isLegacy = hwLevel == CameraCharacteristics.INFO_SUPPORTED_HARDWARE_LEVEL_LEGACY

                  val map = ch.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP) ?: return null
                  val jpegSizes = map.getOutputSizes(ImageFormat.JPEG) ?: return null
                  val previewSizes = map.getOutputSizes(SurfaceHolder::class.java) ?: return null
                  if (jpegSizes.isEmpty() || previewSizes.isEmpty()) return null

                  val jpegSize = chooseJpegSize(jpegSizes)
                  val targetAspect = jpegSize.width.toFloat() / jpegSize.height.toFloat()
                  val previewSize = choosePreviewSize(previewSizes, targetAspect)

                  return CamMeta(
                      id = id,
                      facing = facing,
                      fromCache = fromCache,
                      sensorOrientation = sensorOrientation,
                      hasFlash = hasFlash,
                      activeArray = activeArray,
                      minZoom = minZoom,
                      maxZoom = maxZoom,
                      useZoomRatioApi = useZoomRatioApi,
                      hasAutoFocus = hasAutoFocus,
                      hasContinuousAf = hasContinuousAf,
                      hasAutoAf = hasAutoAf,
                      supportsAeAlwaysFlash = supportsAeAlwaysFlash,
                      supportsAeAutoFlash = supportsAeAutoFlash,
                      supportsFastEdge = supportsFastEdge,
                      supportsFastNr = supportsFastNr,
                      maxRegionsAf = maxRegionsAf,
                      maxRegionsAe = maxRegionsAe,
                      isLegacy = isLegacy,
                      previewSize = previewSize,
                      jpegSize = jpegSize
                  )
              }

              private fun chooseJpegSize(sizes: Array<Size>): Size {
                  val bounded = sizes.filter { it.width.toLong() * it.height.toLong() <= MAX_JPEG_PIXELS }
                  val pool = if (bounded.isNotEmpty()) bounded else sizes.toList()
                  val fourThree = pool.filter { abs(it.width.toFloat() / it.height.toFloat() - 4f / 3f) < 0.08f }
                  val preferred = if (fourThree.isNotEmpty()) fourThree else pool
                  return preferred.maxBy { it.width.toLong() * it.height.toLong() }
              }

              private fun choosePreviewSize(sizes: Array<Size>, targetAspect: Float): Size {
                  val longCap = min(1920, max(displayW, displayH))
                  val shortCap = min(1440, min(displayW, displayH))

                  val aspectMatched = sizes.filter {
                      abs(it.width.toFloat() / it.height.toFloat() - targetAspect) < 0.05f
                  }
                  val pool = if (aspectMatched.isNotEmpty()) {
                      aspectMatched
                  } else {
                      val bestDiff = sizes.minOf { abs(it.width.toFloat() / it.height.toFloat() - targetAspect) }
                      sizes.filter { abs(it.width.toFloat() / it.height.toFloat() - targetAspect) <= bestDiff + 0.02f }
                  }

                  val withinCap = pool.filter {
                      max(it.width, it.height) <= longCap && min(it.width, it.height) <= shortCap
                  }
                  return if (withinCap.isNotEmpty()) {
                      withinCap.maxBy { it.width.toLong() * it.height.toLong() }
                  } else {
                      pool.minBy { it.width.toLong() * it.height.toLong() }
                  }
              }

              private fun checkSwitchAvailability() {
                  try {
                      val prefs = appCtx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val ed = prefs.edit()
                      var hasBack = false
                      var hasFront = false
                      for (id in manager.cameraIdList) {
                          val facing = try {
                              manager.getCameraCharacteristics(id).get(CameraCharacteristics.LENS_FACING)
                          } catch (_: Throwable) { null }
                          if (facing == CameraCharacteristics.LENS_FACING_BACK && !hasBack) {
                              hasBack = true
                              if (!prefs.contains("id_$facing")) ed.putString("id_$facing", id)
                          } else if (facing == CameraCharacteristics.LENS_FACING_FRONT && !hasFront) {
                              hasFront = true
                              if (!prefs.contains("id_$facing")) ed.putString("id_$facing", id)
                          }
                      }
                      ed.apply()
                      val canSwitch = hasBack && hasFront
                      mainHandler.post { listener.onSwitchAvailability(canSwitch) }
                  } catch (_: Throwable) {}
              }

              // ---- Session & repeating preview ----

              private fun tryCreateSession(gen: Int) {
                  val cam = cameraDevice ?: return
                  val surf = previewSurface ?: return
                  val reader = imageReader ?: return
                  if (!active || gen != openGen.get() || surfaceGen != gen) return
                  if (!surf.isValid) return

                  closeSessionInternal()
                  try {
                      val outputs = listOf(OutputConfiguration(surf), OutputConfiguration(reader.surface))
                      val cfg = SessionConfiguration(
                          SessionConfiguration.SESSION_REGULAR,
                          outputs,
                          camExecutor,
                          object : CameraCaptureSession.StateCallback() {
                              override fun onConfigured(session: CameraCaptureSession) {
                                  if (!active || gen != openGen.get() || cameraDevice !== cam) {
                                      try { session.close() } catch (_: Throwable) {}
                                      return
                                  }
                                  captureSession = session
                                  startRepeatingPreview(cam, session, surf)
                              }

                              override fun onConfigureFailed(session: CameraCaptureSession) {
                                  Log2.e("session configure failed")
                                  mainHandler.post { listener.onError("Preview failed") }
                              }
                          }
                      )
                      cam.createCaptureSession(cfg)
                  } catch (e: Throwable) {
                      Log2.e("createCaptureSession failed", e)
                  }
              }

              private fun startRepeatingPreview(cam: CameraDevice, session: CameraCaptureSession, surf: Surface) {
                  val meta = activeMeta ?: return
                  try {
                      val b = cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                      b.addTarget(surf)
                      applyPreviewParams(b, meta)
                      previewBuilder = b
                      session.setRepeatingRequest(b.build(), previewCallback, camHandler)
                      Log2.i("repeating preview started +${Log2.sinceStart()}ms")
                  } catch (e: Throwable) {
                      Log2.e("startRepeatingPreview failed", e)
                  }
              }

              private fun applyPreviewParams(b: CaptureRequest.Builder, meta: CamMeta) {
                  b.set(CaptureRequest.CONTROL_MODE, CameraMetadata.CONTROL_MODE_AUTO)
                  if (meta.hasContinuousAf) {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                  } else if (meta.hasAutoAf) {
                      b.set(CaptureRequest.CONTROL_AF_MODE, CameraMetadata.CONTROL_AF_MODE_AUTO)
                  }
                  applyAeFlash(b, meta)
                  applyZoom(b, meta)
                  customAfRegions?.let { b.set(CaptureRequest.CONTROL_AF_REGIONS, it) }
                  customAeRegions?.let { b.set(CaptureRequest.CONTROL_AE_REGIONS, it) }
              }

              private fun applyAeFlash(b: CaptureRequest.Builder, meta: CamMeta) {
                  if (!meta.hasFlash) {
                      b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON)
                      return
                  }
                  when (flashMode) {
                      FLASH_ON -> {
                          if (meta.supportsAeAlwaysFlash) {
                              b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON_ALWAYS_FLASH)
                          } else {
                              b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON)
                              b.set(CaptureRequest.FLASH_MODE, CameraMetadata.FLASH_MODE_SINGLE)
                          }
                      }
                      FLASH_AUTO -> {
                          if (meta.supportsAeAutoFlash) {
                              b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON_AUTO_FLASH)
                          } else {
                              b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON)
                          }
                      }
                      else -> {
                          b.set(CaptureRequest.CONTROL_AE_MODE, CameraMetadata.CONTROL_AE_MODE_ON)
                          b.set(CaptureRequest.FLASH_MODE, CameraMetadata.FLASH_MODE_OFF)
                      }
                  }
              }

              private fun applyZoom(b: CaptureRequest.Builder, meta: CamMeta) {
                  if (meta.useZoomRatioApi && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      b.set(CaptureRequest.CONTROL_ZOOM_RATIO, currentZoom)
                  } else {
                      b.set(CaptureRequest.SCALER_CROP_REGION, currentVisibleCropRect(meta))
                  }
              }

              private fun currentVisibleCropRect(meta: CamMeta): Rect {
                  val z = max(1f, currentZoom)
                  if (z <= 1.001f) return meta.activeArray
                  val w = meta.activeArray.width()
                  val h = meta.activeArray.height()
                  val cw = (w / z).toInt().coerceAtLeast(1)
                  val ch = (h / z).toInt().coerceAtLeast(1)
                  val left = meta.activeArray.left + (w - cw) / 2
                  val top = meta.activeArray.top + (h - ch) / 2
                  return Rect(left, top, left + cw, top + ch)
              }

              private fun updatePreviewRepeating() {
                  val session = captureSession ?: return
                  val b = previewBuilder ?: return
                  val meta = activeMeta ?: return
                  if (capState != STATE_PREVIEW) return
                  try {
                      applyPreviewParams(b, meta)
                      session.setRepeatingRequest(b.build(), previewCallback, camHandler)
                  } catch (_: Throwable) {}
              }

              private val previewCallback = object : CameraCaptureSession.CaptureCallback() {
                  private fun process(result: CaptureResult) {
                      lastAfState = result.get(CaptureResult.CONTROL_AF_STATE)
                      lastAeState = result.get(CaptureResult.CONTROL_AE_STATE)

                      if (!firstFrameSeen) {
                          firstFrameSeen = true
                          Log2.i("first frame +${Log2.sinceStart()}ms since process start")
                          mainHandler.post { listener.onFirstFrame() }
                          if (!switchChecked) {
                              switchChecked = true
                              camHandler.post { checkSwitchAvailability() }
                          }
                      }

                      when (capState) {
                          STATE_WAITING_LOCK -> {
                              val af = lastAfState
                              val ae = lastAeState
                              val afDone = af == null ||
                                  af == CaptureResult.CONTROL_AF_STATE_FOCUSED_LOCKED ||
                                  af == CaptureResult.CONTROL_AF_STATE_NOT_FOCUSED_LOCKED ||
                                  af == CaptureResult.CONTROL_AF_STATE_PASSIVE_FOCUSED
                              if (afDone) {
                                  if (!pendingNeedsFlash && (ae == null || ae == CaptureResult.CONTROL_AE_STATE_CONVERGED)) {
                                      capState = STATE_PREVIEW
                                      camHandler.removeCallbacks(precaptureTimeout)
                                      captureStillPicture(pendingShotTime, pendingJpegOrient, unlockAfter = true)
                                  } else {
                                      runAePrecapture()
                                  }
                              }
                          }
                          STATE_WAITING_PRECAPTURE -> {
                              val ae = lastAeState
                              if (ae == null ||
                                  ae == CaptureResult.CONTROL_AE_STATE_PRECAPTURE ||
                                  ae == CaptureResult.CONTROL_AE_STATE_FLASH_REQUIRED ||
                                  ae == CaptureResult.CONTROL_AE_STATE_CONVERGED
                              ) {
                                  capState = STATE_WAITING_NON_PRECAPTURE
                              }
                          }
                          STATE_WAITING_NON_PRECAPTURE -> {
                              val ae = lastAeState
                              if (ae == null || ae != CaptureResult.CONTROL_AE_STATE_PRECAPTURE) {
                                  capState = STATE_PREVIEW
                                  camHandler.removeCallbacks(precaptureTimeout)
                                  captureStillPicture(pendingShotTime, pendingJpegOrient, unlockAfter = true)
                              }
                          }
                      }
                  }

                  override fun onCaptureProgressed(s: CameraCaptureSession, r: CaptureRequest, pr: CaptureResult) {
                      process(pr)
                  }

                  override fun onCaptureCompleted(s: CameraCaptureSession, r: CaptureRequest, tr: TotalCaptureResult) {
                      process(tr)
                  }
              }

              private fun startPrecapture(meta: CamMeta, afReady: Boolean, needsFlash: Boolean) {
                  val cam = cameraDevice ?: return
                  val session = captureSession ?: return
                  val surf = previewSurface ?: return
                  val timeoutMs = if (needsFlash) 900L else 450L
                  camHandler.removeCallbacks(precaptureTimeout)
                  camHandler.postDelayed(precaptureTimeout, timeoutMs)

                  try {
                      if (!afReady && meta.hasAutoFocus) {
                          capState = STATE_WAITING_LOCK
                          val b = cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                          b.addTarget(surf)
                          applyPreviewParams(b, meta)
                          b.set(CaptureRequest.CONTROL_AF_TRIGGER, CameraMetadata.CONTROL_AF_TRIGGER_START)
                          session.capture(b.build(), previewCallback, camHandler)
                      } else {
                          runAePrecapture()
                      }
                  } catch (e: Throwable) {
                      Log2.e("startPrecapture failed", e)
                      camHandler.removeCallbacks(precaptureTimeout)
                      capState = STATE_PREVIEW
                      captureStillPicture(pendingShotTime, pendingJpegOrient, unlockAfter = false)
                  }
              }

              private fun runAePrecapture() {
                  val cam = cameraDevice ?: return
                  val session = captureSession ?: return
                  val surf = previewSurface ?: return
                  val meta = activeMeta ?: return
                  try {
                      capState = STATE_WAITING_PRECAPTURE
                      val b = cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                      b.addTarget(surf)
                      applyPreviewParams(b, meta)
                      b.set(CaptureRequest.CONTROL_AE_PRECAPTURE_TRIGGER, CameraMetadata.CONTROL_AE_PRECAPTURE_TRIGGER_START)
                      session.capture(b.build(), previewCallback, camHandler)
                  } catch (e: Throwable) {
                      Log2.e("runAePrecapture failed", e)
                      camHandler.removeCallbacks(precaptureTimeout)
                      capState = STATE_PREVIEW
                      captureStillPicture(pendingShotTime, pendingJpegOrient, unlockAfter = true)
                  }
              }

              private fun captureStillPicture(t0: Long, jpegOrient: Int, unlockAfter: Boolean) {
                  val cam = cameraDevice ?: return
                  val session = captureSession ?: return
                  val reader = imageReader ?: return
                  val meta = activeMeta ?: return

                  try {
                      val b = cam.createCaptureRequest(CameraDevice.TEMPLATE_STILL_CAPTURE)
                      b.addTarget(reader.surface)
                      applyPreviewParams(b, meta)
                      b.set(CaptureRequest.CONTROL_CAPTURE_INTENT, CameraMetadata.CONTROL_CAPTURE_INTENT_STILL_CAPTURE)
                      b.set(CaptureRequest.JPEG_ORIENTATION, jpegOrient)
                      b.set(CaptureRequest.JPEG_QUALITY, 92.toByte())
                      if (meta.supportsFastEdge) b.set(CaptureRequest.EDGE_MODE, CameraMetadata.EDGE_MODE_FAST)
                      if (meta.supportsFastNr) b.set(CaptureRequest.NOISE_REDUCTION_MODE, CameraMetadata.NOISE_REDUCTION_MODE_FAST)

                      inFlightCaptures.incrementAndGet()
                      pendingShots.addLast(ShotMeta(t0))
                      mainHandler.post { listener.onShutterTriggered() }

                      session.capture(b.build(), object : CameraCaptureSession.CaptureCallback() {
                          override fun onCaptureCompleted(s: CameraCaptureSession, r: CaptureRequest, tr: TotalCaptureResult) {
                              if (unlockAfter) unlockFocus()
                          }

                          override fun onCaptureFailed(s: CameraCaptureSession, r: CaptureRequest, f: CaptureFailure) {
                              Log2.e("still capture failed reason=${f.reason}")
                              if (pendingShots.isNotEmpty()) pendingShots.pollFirst()
                              inFlightCaptures.decrementAndGet()
                              if (unlockAfter) unlockFocus()
                          }
                      }, camHandler)
                  } catch (e: Throwable) {
                      Log2.e("captureStillPicture failed", e)
                      if (unlockAfter) unlockFocus()
                  }
              }

              private fun unlockFocus() {
                  val cam = cameraDevice ?: return
                  val session = captureSession ?: return
                  val surf = previewSurface ?: return
                  val meta = activeMeta ?: return
                  try {
                      val b = cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                      b.addTarget(surf)
                      applyPreviewParams(b, meta)
                      b.set(CaptureRequest.CONTROL_AF_TRIGGER, CameraMetadata.CONTROL_AF_TRIGGER_CANCEL)
                      session.capture(b.build(), previewCallback, camHandler)
                      updatePreviewRepeating()
                  } catch (_: Throwable) {}
              }

              private fun onImageAvailable(reader: ImageReader) {
                  var img: Image? = null
                  val shot = pendingShots.pollFirst() ?: ShotMeta(SystemClock.elapsedRealtime())
                  try {
                      img = reader.acquireNextImage() ?: return
                      val buf = img.planes[0].buffer
                      val bytes = ByteArray(buf.remaining())
                      buf.get(bytes)
                      val capMs = SystemClock.elapsedRealtime() - shot.t0
                      Log2.i("jpeg ready ${bytes.size / 1024}KB in ${capMs}ms")
                      ioExecutor.execute { saveJpegAndThumb(bytes, shot.t0) }
                  } catch (e: Throwable) {
                      Log2.e("onImageAvailable failed", e)
                  } finally {
                      try { img?.close() } catch (_: Throwable) {}
                      inFlightCaptures.decrementAndGet()
                  }
              }

              private fun saveJpegAndThumb(bytes: ByteArray, t0: Long) {
                  // 1) Decode lightweight thumbnail for immediate visual confirmation
                  try {
                      val opts = BitmapFactory.Options().apply { inSampleSize = 8 }
                      val raw = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts)
                      if (raw != null) {
                          val exif = ExifInterface(ByteArrayInputStream(bytes))
                          val rot = when (exif.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)) {
                              ExifInterface.ORIENTATION_ROTATE_90 -> 90f
                              ExifInterface.ORIENTATION_ROTATE_180 -> 180f
                              ExifInterface.ORIENTATION_ROTATE_270 -> 270f
                              else -> 0f
                          }
                          val thumb = if (rot != 0f) {
                              val m = Matrix().apply { postRotate(rot) }
                              Bitmap.createBitmap(raw, 0, 0, raw.width, raw.height, m, true).also {
                                  if (it !== raw) raw.recycle()
                              }
                          } else {
                              raw
                          }
                          mainHandler.post { listener.onThumbReady(thumb) }
                      }
                  } catch (_: Throwable) {}

                  // 2) Atomic MediaStore write with IS_PENDING
                  val resolver = appCtx.contentResolver
                  val name = "IMG_${NAME_FMT.format(LocalDateTime.now())}"
                  val cv = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/FastCam")
                      put(MediaStore.MediaColumns.IS_PENDING, 1)
                  }
                  var uri: Uri? = null
                  try {
                      uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return
                      resolver.openOutputStream(uri)?.use { it.write(bytes) }
                      val done = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                      resolver.update(uri, done, null, null)
                      Log2.i("saved $uri in ${SystemClock.elapsedRealtime() - t0}ms")
                      val savedUri = uri
                      mainHandler.post { listener.onPhotoSaved(savedUri) }
                  } catch (e: Throwable) {
                      Log2.e("MediaStore save failed", e)
                      if (uri != null) {
                          try { resolver.delete(uri, null, null) } catch (_: Throwable) {}
                      }
                      mainHandler.post { listener.onError("Save failed") }
                  }
              }

              private fun computeJpegOrientation(meta: CamMeta, deviceOrient: Int): Int {
                  val d = ((deviceOrient + 45) / 90 * 90) % 360
                  return if (meta.facing == CameraCharacteristics.LENS_FACING_FRONT) {
                      (meta.sensorOrientation - d + 360) % 360
                  } else {
                      (meta.sensorOrientation + d) % 360
                  }
              }

              private fun closeSessionInternal() {
                  camHandler.removeCallbacks(precaptureTimeout)
                  camHandler.removeCallbacks(resetFocusRunnable)
                  capState = STATE_PREVIEW
                  try { captureSession?.close() } catch (_: Throwable) {}
                  captureSession = null
                  previewBuilder = null
              }

              private fun closeCameraInternal() {
                  closeSessionInternal()
                  try { cameraDevice?.close() } catch (_: Throwable) {}
                  cameraDevice = null
                  try { imageReader?.close() } catch (_: Throwable) {}
                  imageReader = null
                  pendingShots.clear()
                  inFlightCaptures.set(0)
              }
          }
